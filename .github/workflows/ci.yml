name: CI

# Pull requests that are ready for review run the full matrix, the compatibility suites and the docs build; `ci-ok`
# is the required status check of the `main` branch protection, so a merge needs every row green. Draft pull requests
# run nothing (mark the PR ready for review to start the run; later pushes re-run it). Pushes to `main` run nothing
# here: the merged tree is the one the pull request tested (branches must be up to date), `pages.yml` publishes the
# site and `release.yml` runs the matrix again on the tag before publishing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full Spark x Delta x JDK matrix instead of the smoke subset
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Run the full Spark x Delta x JDK matrix instead of the smoke subset
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        # Pull requests run every row; workflow_dispatch and workflow_call follow inputs.full (false = the smoke rows).
        # github.event_name cannot tell a workflow_call apart: in a called workflow it is the caller's event.
        run: echo "matrix=$(jq -c '[.[] | select(${{ (github.event_name == 'pull_request' || inputs.full) && 'true' || '.smoke' }})]' matrix.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: ${{ matrix.module }} spark-${{ matrix.spark }} delta-${{ matrix.delta }} jdk-${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    services:
      ministack:
        image: ministackorg/ministack:1.5.31
        env:
          AUTH: "true"
        ports:
          - "4566:4566"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - env:
          DELTA_ARTIFACT: ${{ matrix.deltaArtifact }}
        run: ./mvnw -B -ntp -pl modules/${{ matrix.module }} -Dspark.version=${{ matrix.spark }} -Ddelta.version=${{ matrix.delta }} ${DELTA_ARTIFACT:+-Ddelta.artifact=$DELTA_ARTIFACT} verify

  # Trino and Spark 3.5 with the Glue Hive client read gluecat's Glue entries, and gluecat reads theirs, on the
  # containers of docker/docker-compose.yml.
  compat:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mkdir -m 0777 -p /tmp/gluecat-compat && docker compose -f docker/docker-compose.yml up -d --wait
      - env:
          TRINO_URL: jdbc:trino://localhost:8080
          LEGACY_SPARK_CONTAINER: legacy-spark
        run: >-
          ./mvnw -B -ntp -pl modules/spark-4.1_2.13 -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test='TrinoCompat*IT,LegacyHiveGlueCompat*IT' verify

  # A broken link or nav entry fails the pull request; the site is deployed by pages.yml.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - run: pip install -r docs/site/requirements.txt
      - run: mkdir -p docs/site/assets && cp docs/logo/gluecat-icon.png docs/logo/gluecat-banner.jpg docs/site/assets/ && cp CHANGELOG.md docs/site/changelog.md
      - run: mkdocs build --strict

  # One status check for branch protection: green only when every matrix row, the compatibility suites and the docs
  # build succeeded (a skipped or cancelled job is a failure here).
  ci-ok:
    needs: [test, compat, docs]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test=${{ needs.test.result }} compat=${{ needs.compat.result }} docs=${{ needs.docs.result }}"
          test "${{ needs.test.result }}" = success -a "${{ needs.compat.result }}" = success -a "${{ needs.docs.result }}" = success
