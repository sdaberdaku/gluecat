# Containers for the compatibility suites (TrinoCompat*IT, LegacyHiveGlueCompat*IT): make compat-up / compat-down.
# /tmp/gluecat-compat must exist with mode 0777 before `up`: the tests write table data there and both readers see it
# at the same path (make compat-down empties it). The ministack service replaces the standalone MiniStack container
# on port 4566.
services:
  ministack:
    image: ministackorg/ministack:1.5.31
    container_name: ministack
    ports:
      - "4566:4566"

  trino:
    image: trinodb/trino:484
    container_name: trino
    depends_on:
      - ministack
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - /tmp/gluecat-compat:/tmp/gluecat-compat

  # Spark 3.5.1 with the patched Hive and the Glue Hive client (fork tag v3.5.1 of
  # aws-glue-data-catalog-client-for-apache-hive-metastore) and delta-spark 3.2.0; runs as uid 185.
  legacy-spark:
    image: ghcr.io/sdaberdaku/spark-glue-python:v3.5.1-python3.10.14
    container_name: legacy-spark
    # The Glue client reaches MiniStack through glue-defaults-proxy.py. With an endpoint set it signs with the region
    # SDK v1 finds in the host name (glue.<region>.*), and MiniStack keeps Glue state per region: this name puts its
    # requests in eu-central-1 with everything else.
    extra_hosts:
      - "glue.eu-central-1.proxy:127.0.0.1"
    command: ["sh", "-c", "python3 -I /opt/glue-defaults-proxy.py & exec sleep infinity"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 4566), 2)"]
      interval: 2s
      retries: 15
    environment:
      AWS_ACCESS_KEY_ID: "111111111111"
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./legacy/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./legacy/glue-defaults-proxy.py:/opt/glue-defaults-proxy.py:ro
      - /tmp/gluecat-compat:/tmp/gluecat-compat
