# Spark's Hive path with the Glue Hive client, pointed at MiniStack account 111111111111 through glue-defaults-proxy.py.
# aws.region is not set: the client ignores it when aws.glue.endpoint is set and signs with the region in the
# endpoint's host name instead.
spark.sql.catalogImplementation                 hive
spark.hive.imetastoreclient.factory.class       com.amazonaws.glue.catalog.metastore.AWSGlueDataCatalogHiveClientFactory
spark.hadoop.aws.glue.endpoint                  http://glue.eu-central-1.proxy:4566
spark.hadoop.hive.metastore.glue.catalogid      111111111111
spark.sql.extensions                            io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                 org.apache.spark.sql.delta.catalog.DeltaCatalog
