# Table data lives under /tmp/gluecat-compat (file: locations). Trino's native local file system reads them;
# local.location is the root that file: paths resolve against. Trino 484 has no Delta transaction log synchronizer
# for file:, so INSERT into these tables fails; CREATE TABLE and CREATE TABLE AS work.
fs.local.enabled=true
local.location=/
